<!-- 资产管理页面 -->
<div id="jm-assets-page" class="jm-assets-page">
    <!-- 胶囊型选项卡栏 -->
    <div class="jm-assets-type-bar">
        <button class="jm-assets-type-btn active" data-type="video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <span class="btn-text">视频</span>
        </button>
        <button class="jm-assets-type-btn" data-type="image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="btn-text">图片</span>
        </button>
        <button class="jm-assets-type-btn" data-type="audio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
            <span class="btn-text">音频</span>
        </button>
    </div>

    <!-- 内容区域（由 JS 动态渲染） -->
    <div id="jm-assets-content" class="jm-assets-content"></div>
</div>
