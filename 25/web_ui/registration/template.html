<!-- 注册模式模板 - 由 TabManager 按需加载 -->
<div class="reg-scope">
    <!-- 双栏布局：左侧表单 + 右侧摘要 -->
    <div class="reg-layout">
        <div class="reg-left" id="regLeftContent">
            <!-- 基础配置卡片 -->
            <div class="reg-card" id="reg-card-basic">
                <div class="reg-card-title">基础配置</div>
                <div class="reg-grid-2">
                    <div class="reg-field">
                        <label class="reg-label">平台</label>
                        <select class="reg-select" id="reg-platform" onchange="parent.RegisterApp.onPlatformChange(this.value)">
                            <option value="">-- 选择平台 --</option>
                        </select>
                    </div>
                    <div class="reg-field">
                        <label class="reg-label">注册数量</label>
                        <input type="number" class="reg-input" id="reg-count" value="1" min="1" max="100"
                            oninput="parent.RegisterApp.onFieldChange('count', Number(this.value))">
                    </div>
                </div>
                <div class="reg-field" style="margin-top: 14px;">
                    <label class="reg-label">代理 (可选)</label>
                    <input type="text" class="reg-input" id="reg-proxy" value=""
                        placeholder="http://user:pass@host:port"
                        style="font-family: Consolas, monospace; font-size: 12px;"
                        oninput="parent.RegisterApp.onFieldChange('proxy', this.value)">
                </div>
            </div>

            <!-- 注册方式卡片 -->
            <div class="reg-card" id="reg-card-identity">
                <div class="reg-card-title">Step 1 - 账号来源</div>
                <div class="reg-pill-group" id="reg-identity-options">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 执行通道卡片 -->
            <div class="reg-card" id="reg-card-executor">
                <div class="reg-card-title">Step 2 - 执行通道</div>
                <div class="reg-pill-group" id="reg-executor-options">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- Chrome Profile 配置（OAuth 时显示） -->
            <div class="reg-card reg-hidden" id="reg-card-chrome-profile">
                <div class="reg-card-title">Chrome Profile 配置</div>
                <div class="reg-alert info" style="margin-bottom: 12px;">
                    如果已有登录账号或需要远程调试，请配置 Chrome Profile 以复用登录状态
                </div>
                <div class="reg-field">
                    <label class="reg-label">预登录账号邮箱 (可选)</label>
                    <input type="email" class="reg-input" id="reg-oauth-email-hint" value=""
                        placeholder="your-account@example.com"
                        oninput="parent.RegisterApp.onFieldChange('oauth_email_hint', this.value)">
                </div>
                <div class="reg-field">
                    <label class="reg-label">Chrome 用户数据目录</label>
                    <input type="text" class="reg-input" id="reg-chrome-user-data-dir" value=""
                        placeholder="~/Library/Application Support/Google/Chrome"
                        oninput="parent.RegisterApp.onFieldChange('chrome_user_data_dir', this.value)">
                </div>
                <div class="reg-field">
                    <label class="reg-label">Chrome CDP 地址</label>
                    <input type="text" class="reg-input" id="reg-chrome-cdp-url" value=""
                        placeholder="http://localhost:9222"
                        oninput="parent.RegisterApp.onFieldChange('chrome_cdp_url', this.value)">
                </div>
            </div>

            <!-- 邮件服务商配置（邮箱注册时显示） -->
            <div class="reg-card reg-hidden" id="reg-card-mail-provider">
                <div class="reg-card-title">邮件服务商配置</div>
                <div id="reg-mail-provider-error"></div>
                <div class="reg-field" id="reg-mail-provider-select"></div>
            </div>

            <!-- 短信服务商配置 -->
            <div class="reg-card reg-hidden" id="reg-card-sms-provider">
                <div class="reg-card-title">短信服务商配置</div>
                <div class="reg-field" id="reg-sms-provider-select"></div>
            </div>
        </div>

        <!-- 右侧：摘要 + 状态 -->
        <div class="reg-right">
            <!-- 当前配置摘要 -->
            <div class="reg-summary-card" id="reg-card-summary">
                <div class="reg-card-title">当前配置摘要</div>
                <div id="reg-summary-chips">
                    <!-- 动态渲染 -->
                </div>
                <button class="reg-submit-btn" id="reg-submit-btn" onclick="parent.RegisterApp.submit()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    开始注册
                </button>
            </div>

            <!-- 执行状态 -->
            <div class="reg-status-card" id="reg-card-task-status">
                <div class="reg-card-title">执行状态</div>
                <div id="reg-task-body">
                    <div style="text-align:center;padding:24px 16px;">
                        <div style="font-size:32px;margin-bottom:8px;opacity:0.3;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        </div>
                        <div style="font-size:13px;color:#6e7681;">提交任务后将显示执行状态和日志</div>
                    </div>
                </div>
            </div>

            <!-- 实时日志 -->
            <div class="reg-log-card">
                <div class="reg-card-title" style="justify-content: space-between;">
                    <span style="display:flex;align-items:center;gap:6px;">实时日志</span>
                    <button style="background:none;border:none;color:#6e7681;cursor:pointer;font-size:10px;padding:2px 6px;"
                        onclick="parent.RegisterApp.clearLogs()">清空</button>
                </div>
                <div class="reg-log-panel" id="reg-log-panel">
                    <div class="reg-log-line reg-log-info">等待任务开始...</div>
                </div>
            </div>
        </div>
    </div>
</div>
